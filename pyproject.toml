[project]
name = "XCoreRuntime"
version = "2.7.0"
description = "Plugin-first orchestration framework built on FastAPI"
authors = [
    { name = "Eliezer Traore", email = "68350805+traoreera@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"
homepage = "https://xcorehub.dev"
repository = "https://github.com/traoreera/xcore"
keywords = ["xcore", "plugin", "runtime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

requires-python = ">=3.12,<4.0"

# ── Noyau ───────────────────────────────────────────────────────────────────────
# Ce que `import xcore` et la config par défaut (zero-config) chargent
# réellement, sans condition :
#   - fastapi[standard] : le framework lui-même.
#   - pydantic : modèles (router IPC, manifest…) — fastapi[standard] le tire
#     déjà en transitif, mais il est importé directement par xcore.
#   - pyyaml : chargement d'integration.yaml.
#   - apscheduler : SchedulerConfig.enabled=True par défaut (backend memory) —
#     le scheduler tourne dès le boot sans configuration explicite.
#   - opentelemetry-api/sdk : importés au niveau module de
#     kernel/observability/tracing.py, chargé inconditionnellement au boot
#     (le tracer est noop par défaut, mais le SDK doit être présent).
# Tout le reste n'est utilisé que si le service correspondant est configuré
# (services.databases, cache/scheduler backend=redis, xworker.enabled…) —
# voir [project.optional-dependencies] ci-dessous.
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "apscheduler>=3.11.3,<4.0.0",
    "opentelemetry-api>=1.45.0,<2.0.0",
    "opentelemetry-sdk>=1.45.0,<2.0.0",
]

# ── Dépendances optionnelles ─────────────────────────────────────────────────────
# Runtime : pip install XCoreRuntime[redis,worker,...]
#   postgres   driver PostgreSQL sync + async (psycopg2, sqlalchemy[asyncio])
#              — nécessaire pour une URL 'postgresql://...' dans services.databases
#   sqlite     driver SQLite async (aiosqlite, sqlalchemy[asyncio])
#              — nécessaire pour une URL 'sqlite+aiosqlite://...'
#   db         postgres + sqlite réunis (confort dev/prod mixte)
#   migrations runner de migrations SQLAlchemy (alembic) — MigrationRunner
#              importe alembic à la demande, jamais utilisé sinon
#   redis      backend cache/scheduler distribué (services.cache/scheduler
#              backend: redis|tiered) — non utilisé par le backend "memory" par défaut
#   worker     service xworker (Celery) — instancié seulement si
#              services.xworker.enabled=true (False par défaut)
#   tracing    exporteur OTLP/HTTP (observability.tracing.endpoint) — sans
#              endpoint configuré, l'export console (déjà dans le noyau) suffit
#   dotenv     chargement de fichier .env (app.dotenv / plugin envconfiguration)
#              — déjà gracieusement optionnel dans le code (try/except)
#   metrics    backend de métriques Prometheus (observability.metrics.backend:
#              prometheus) — fallback silencieux sur le backend memory sinon
#   sdk        SDK complet pour auteurs de plugins (xcdk)
#   xcli       CLI xcore (xcorecli)
#   cpp        accélération C++ du scanner AST (xcorescanner)
#   all        tout ce qui précède
[project.optional-dependencies]
postgres   = ["sqlalchemy[asyncio]>=2.1.1,<3.0.0", "psycopg2>=2.9.13,<3.0.0"]
sqlite     = ["sqlalchemy[asyncio]>=2.1.1,<3.0.0", "aiosqlite>=0.22.1,<1.0.0"]
db         = ["sqlalchemy[asyncio]>=2.1.1,<3.0.0", "psycopg2>=2.9.13,<3.0.0", "aiosqlite>=0.22.1,<1.0.0"]
migrations = ["alembic>=1.20.0,<2.0.0"]
redis      = ["redis[hiredis]>=7.0.0,<9.0.0"]
worker     = ["celery>=5.6.3,<6.0.0"]
tracing    = ["opentelemetry-exporter-otlp-proto-http>=1.45.0,<2.0.0"]
dotenv     = ["python-dotenv>=1.2.3,<2.0.0"]
metrics    = ["prometheus-client>=0.26.0,<0.27.0"]
sdk        = ["xcdk>=0.1.0"]
xcli       = ["xcorecli>=1.1.0"]
cpp        = ["xcorescanner>=0.1.0"]
all = [
    "sqlalchemy[asyncio]>=2.1.1,<3.0.0", "psycopg2>=2.9.13,<3.0.0", "aiosqlite>=0.22.1,<1.0.0",
    "alembic>=1.20.0,<2.0.0", "redis[hiredis]>=7.0.0,<9.0.0", "celery>=5.6.3,<6.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0,<2.0.0", "python-dotenv>=1.2.3,<2.0.0",
    "prometheus-client>=0.26.0,<0.27.0",
    "xcdk>=0.1.0", "xcorecli>=1.1.0", "xcorescanner>=0.1.0",
]

# ── Build system ───────────────────────────────────────────────────────────────
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ── Poetry metadata (requis par poetry-core en mode package) ───────────────────
# Poetry 2.x lit [project] pour les deps mais a encore besoin de [tool.poetry]
# pour les groupes dev/docs et les packages à inclure dans le build.
[tool.poetry]
packages = [{ include = "xcore" }]

# ── Development dependencies ───────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
pytest            = "^9.0.3"
pytest-asyncio    = "^1.2.0"
pytest-cov        = "^7.1.0"
pytest-benchmark  = "^5.2.3"
httpx             = "^0.28.1"
aiohttp           = "^3.14.3"
faker             = "^37.8.0"
psutil            = "^7.0.0"
black             = "^26.3.1"
isort             = "^8.0.1"
flake8            = "^7.3.0"
autoflake         = "^2.3.1"
autopep8          = "^2.3.2"
bandit            = "^1.8.6"
pre-commit        = "^4.6.0"
prometheus-client = { version = ">=0.26.0,<0.27.0" }
# Doublons volontaires des extras runtime optionnels (voir
# [project.optional-dependencies]) : la CI fait `poetry install --with dev`
# sans --extras, donc les tests qui exercent ces backends (DB, redis, celery,
# alembic, exporteur OTLP, dotenv) ont besoin de ces paquets ici aussi.
sqlalchemy    = { version = ">=2.1.1,<3.0.0", extras = ["asyncio"] }
psycopg2      = "^2.9.13"
aiosqlite     = "^0.22.1"
alembic       = "^1.20.0"
redis         = { version = ">=7.0.0,<9.0.0", extras = ["hiredis"] }
celery        = "^5.6.3"
opentelemetry-exporter-otlp-proto-http = "^1.45.0"
python-dotenv = "^1.2.3"
# ── Docs dependencies ──────────────────────────────────────────────────────────
[tool.poetry.group.docs.dependencies]
mkdocs                = "^1.6.1"
mkdocs-material       = "^9.7.3"
mkdocs-minify-plugin  = "^0.8.0"
mkdocstrings          = "^1.0.3"
mkdocstrings-python   = ">=2.0.3,<3.0.0"
markdown              = "^3.8.2"

# ── Linting ────────────────────────────────────────────────────────────────────
[tool.black]
line-length    = 88
target-version = ["py312"]   # était py311, ton requires-python est >=3.12

[tool.isort]
profile     = "black"
line_length = 88

# NB: [tool.flake8] n'est pas lu par flake8 dans pyproject.toml —
#     flake8 lit uniquement setup.cfg ou .flake8 à la racine.
#     Le fichier .flake8 généré précédemment est la bonne config.

# ── Tests ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts      = "-q --tb=short"
asyncio_mode = "auto"   # pour pytest-asyncio

# ── Coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["xcore"]
branch = true
omit   = ["*/tests/*", "*/__pycache__/*", "*/alembic/*"]

[tool.coverage.report]
show_missing  = true
skip_covered  = false
fail_under    = 80     # seuil actuel réel — monter au fur et à mesure
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
