# ============================================================
# Docs — Build MkDocs & Deploy Netlify
# Déclenché sur : push main (production), PR (deploy preview),
#                 tags et manuellement (workflow_dispatch)
#
# Secrets requis dans le repo :
#   NETLIFY_AUTH_TOKEN  → généré via Netlify UI (User settings → Applications)
#   NETLIFY_SITE_ID     → copié depuis Site settings → Site information → API ID
#
# Pour créer le site la première fois :
#   netlify sites:create --name <slug>   (ou via l'UI Netlify)
# ============================================================

name: Docs – Deploy Netlify

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: 📖 Build MkDocs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-docs-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies (groupe docs)
        run: poetry install --no-interaction --with docs --no-root

      - name: Build site
        run: poetry run mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 7

  deploy:
    name: 🚀 Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./site
          production-deploy: false
          alias: docs-preview-${{ github.event.number }}
          deploy-message: "Preview (PR #${{ github.event.number }})"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pull-request-comment: true
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy production (main/tag/manual)
        if: github.event_name != 'pull_request'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./site
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy ${{ github.ref }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
